[package]
name = "libsecp256k1-core"
description = "Core functions for pure Rust secp256k1 implementation."
license = "Apache-2.0"
version = "0.3.0"
authors = ["Wei Tang <hi@that.world>"]
repository = "https://github.com/paritytech/libsecp256k1"
keywords = ["crypto", "ECDSA", "secp256k1", "bitcoin", "no_std"]
edition = "2018"

[dependencies]
subtle = { git = "https://github.com/fluentlabs-xyz/subtle", branch = "feat/svm-2.4.1", default-features = false }
#subtle = { path = "../../subtle", default-features = false }
crunchy = "0.2"
digest = "0.9"

[features]
default = ["std"]
std = ["subtle/std"]
